[project]
name = "ha-night-time-ac"
version = "1.1.0"
description = "Home Assistant blueprint: keep a room under a temperature limit at night, and the air conditioner off (and quiet) the rest of the time."
requires-python = ">=3.12"
license = "MIT"

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6", "jinja2>=3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
